[build-system]
requires = ["setuptools>=61,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ckanext-serverterminal"
dynamic = ["version"]
description = "Admin-only, read-only server log viewer for CKAN"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "UNCKAN", email = "unckan@data99.com.ar"}]
maintainers = [{name = "UNCKAN", email = "unckan@data99.com.ar"}]
keywords = ["CKAN", "logs", "administration", "server"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/unckan/ckanext-serverterminal"
Issues = "https://github.com/unckan/ckanext-serverterminal/issues"

[project.entry-points."ckan.plugins"]
serverterminal = "ckanext.serverterminal.plugin:ServerterminalPlugin"

[project.entry-points."babel.extractors"]
ckan = "ckan.lib.extract:extract_ckan"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["contrib", "docs", "tests*"]
namespaces = true

[tool.setuptools.package-data]
include = ["*"]

[tool.setuptools.dynamic]
version = {attr = "ckanext.serverterminal.__VERSION__"}

[tool.babel.extractors.ckanext]
"**.py" = "python"
"**.js" = "javascript"
"**/templates/**.html" = "ckan"

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::sqlalchemy.exc.SADeprecationWarning",
  "ignore::sqlalchemy.exc.SAWarning",
  "ignore::DeprecationWarning",
]
addopts = "--ckan-ini test.ini"
